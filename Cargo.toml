[package]
name = "python-lightningcss"
version = "0.3.1"
edition = "2021"

[lib]
name = "lightningcss"
crate-type = ["cdylib"]

[dependencies]
browserslist-rs = "=0.19.0"
cssparser = "=0.33.0"
parcel_selectors = "=0.28.2"
lightningcss = { version = "=1.0.0-alpha.68", features = ["browserslist"] }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
